<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberhold Kingdom</title>
<style>

:root{--bg:#1d2a24;--panel:#2a3b33;--panel2:#34483e;--ink:#f1e9d2;--mute:#a9b8a8;--gold:#e8b94a;--stone:#9fb0b8;--wood:#c08a55;--food:#8fc16a;--red:#d9604c;--line:#4a6154;--btn:#e8b94a;--btnink:#2b2008;--g1:#62a24c;--g2:#599a43;--r0:#9aa4a8;--r1:#4fae5a;--r2:#4a8fe0;--r3:#b073f0;--r4:#f0a62a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e2cc;--panel:#f6f0dd;--panel2:#ebe3c8;--ink:#2a2418;--mute:#6b6450;--line:#c9bf9c;--btn:#2f5d46;--btnink:#fff;--gold:#9a6b00;--stone:#4d6672;--wood:#8a5527;--food:#3f7a1f;--red:#b23a28;--g1:#8ccb62;--g2:#82c25a;--r0:#6b747a;--r1:#2e8a3a;--r2:#2565b8;--r3:#7a3bb8;--r4:#b87400;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Palatino Linotype",serif;line-height:1.4}
h1,h2{font-family:"Trebuchet MS",Verdana,sans-serif;margin:0}h1{font-size:1.15rem}h2{font-size:1rem;margin-bottom:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--line);padding:8px 12px}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.res{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:Verdana,sans-serif;font-size:.82rem}
.g{color:var(--gold)}.s{color:var(--stone)}.w{color:var(--wood)}.f{color:var(--food)}
.res>span{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1px 9px}.iso{border-radius:8px;overflow:hidden;border:2px solid var(--line)}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}.grp img{height:42px;width:auto;margin-right:2px}
.who{display:flex;gap:8px;align-items:center}.who img{height:46px;width:auto;flex:none}
main{max-width:1060px;margin:0 auto;padding:12px}
.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:12px;margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.alert{background:var(--panel2);border-left:4px solid var(--red);padding:8px 10px;border-radius:4px;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--line);padding:2px;border-radius:8px}
button{font-family:Verdana,sans-serif;font-size:.78rem;background:var(--btn);color:var(--btnink);border:0;border-radius:6px;padding:6px 10px;cursor:pointer;min-height:32px}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.alt{background:var(--panel2);color:var(--ink)}button.sm{padding:4px 9px}
.tile{position:relative;aspect-ratio:1;min-height:0;padding:0;font-size:clamp(14px,3.6vw,28px);background:var(--g1);border-radius:3px;color:inherit;display:flex;align-items:center;justify-content:center}
.tile:nth-child(even){background:var(--g2)}
.tile.sel{outline:3px solid var(--gold);outline-offset:-3px}
.lv,.bub{position:absolute;font:700 10px Verdana;font-style:normal;border-radius:8px;padding:0 4px}
.lv{top:0;left:1px;background:#0008;color:#fff}.bub{top:-3px;right:-2px;background:var(--gold);color:#2b2008}
.pb{position:absolute;left:3px;right:3px;bottom:2px;height:5px;background:#0007;border-radius:3px;overflow:hidden}.pb b{display:block;height:100%;background:var(--food)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.row small{color:var(--mute);display:block}.m{color:var(--mute);font-size:.84rem;margin:4px 0}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--red);transition:width .9s linear}
#log p{margin:3px 0;font-size:.82rem;color:var(--mute)}#log .win{color:var(--food)}#log .lose{color:var(--red)}

/* V2.1 – Emberhold medieval UI; game logic unchanged */
:root,:root:not([data-theme="dark"]){--bg:#121611;--panel:#20271f;--panel2:#2b3428;--ink:#f1e5ca;--mute:#b0b39e;--gold:#e5bc69;--stone:#b4c2ca;--wood:#d3a276;--food:#a7ce83;--red:#e17c69;--line:#514b37;--btn:#dcb66a;--btnink:#231b0f;color-scheme:dark}
body{min-height:100vh;background:radial-gradient(ellipse at 28% 0%,#343b28 0%,#171d16 48%,#10140f 100%);font-family:Georgia,serif}
header{padding:16px clamp(12px,3vw,42px);background:linear-gradient(110deg,#252b21,#151b15);border-bottom:1px solid #8a7145;box-shadow:0 8px 30px #0005}
.brand{display:flex;align-items:center;gap:12px}.crest{display:grid;place-items:center;width:44px;height:48px;background:#393423;border:1px solid #b79455;color:var(--gold);font-size:30px;border-radius:5px 5px 15px 15px}.brand small{font:600 9px Verdana,sans-serif;letter-spacing:3px;color:var(--gold)}.brand h1{font: bold clamp(19px,2.5vw,30px) Georgia,serif;letter-spacing:.3px}
.res{gap:7px;font-size:.82rem}.res>span{border-radius:6px;padding:5px 9px;background:#121810;border-color:#62563d}.res>span>span{padding:0}
main{max-width:1600px;padding:clamp(12px,2.5vw,30px);margin:auto}.layout{grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:18px;align-items:stretch;margin-top:16px}
.realm,.card{padding:14px;border:1px solid #6b5839;border-radius:10px;background:linear-gradient(145deg,#272e23,#1a211a);box-shadow:0 12px 30px #0004;min-width:0}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px;border-bottom:1px solid #665538;padding-bottom:10px}.section-heading span{font:700 11px Verdana,sans-serif;letter-spacing:1.7px;color:var(--gold)}.section-heading small{color:var(--mute);font-size:12px}
.alert{background:#2b3024;border-radius:5px;padding:10px 12px}.iso{border:1px solid #a48b53;border-radius:7px;box-shadow:0 5px 15px #0006;overflow:hidden}.realm>.m{margin-top:10px}.tabs{gap:6px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.tabs button{min-height:40px;padding:7px 4px;border:1px solid #927442;font-weight:700}.tabs button.alt{border-color:#514b37;background:#171e17;color:#d8d0b9}.tabs button.alt:hover{background:#343d2c}button{background:linear-gradient(#e5c47e,#c3994c);border:1px solid #e1ba70;border-radius:5px;font-weight:600}button.alt{background:#2b3428;border-color:#544d38}button:not(:disabled):hover{filter:brightness(1.13)}.row{padding:10px 0}.card h2{font-family:Georgia,serif;font-size:1.25rem;color:#efd59b}.bar{height:9px;background:#141a14}.bar i{background:linear-gradient(90deg,#9e3c32,#e88861)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.top{align-items:flex-start}.res{width:100%;gap:5px}.section-heading small{font-size:11px}.realm,.card{padding:10px}header{position:relative}}


.map-tools{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}.map-tools button{min-height:30px}.map-tools span{font:12px Verdana;color:var(--gold)}.map-tools button[aria-pressed=true]{outline:2px solid #f3ddab}.pan-mode,.pan-mode svg g{cursor:grab!important}.pan-mode{touch-action:none}.iso svg [data-a=tile]:hover>polygon{stroke:#f9df94;stroke-width:2}.monster-bob{animation:bob .7s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-2px)}}@media(prefers-reduced-motion:reduce){.monster-bob{animation:none}}
@media(min-width:851px){main{padding:12px 24px}.layout{margin-top:10px}.iso svg{max-height:calc(100vh - 295px);min-height:260px;background:#304c30}.card{max-height:calc(100vh - 170px);overflow:auto}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="crest" aria-hidden="true">♜</span><div><small>THE REALM OF</small><h1>Emberhold Kingdom</h1></div></div><div class="res" id="res"></div></div></header>
<main>
<div id="goal"></div>
<div class="layout">
 <section class="realm"><div class="section-heading"><span>YOUR KINGDOM</span><small>Village overview</small></div><div id="raid" class="alert" style="margin-bottom:8px"></div><div class="map-tools"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomRead">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="panToggle" aria-pressed="false">Drag map</button><button id="zoomReset">Reset view</button></div><div class="iso" id="grid"></div><p class="m">Coin bubbles mean goods are ready. Tap the building to collect.</p></section>
 <section class="card"><div class="section-heading"><span>COMMAND CENTER</span><small>Manage your realm</small></div><div class="tabs" id="tabs"></div><div id="panel"></div></section>
</div>
</main>
<script src="game.js?v=2.2"></script>
</body>
</html>
