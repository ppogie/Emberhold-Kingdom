let S=fresh();try{let a=JSON.parse(localStorage.getItem(KEY));if(a&&Array.isArray(a.units)&&Array.isArray(a.nodes)&&a.res)S=a}catch(e){}for(const u of S.units){u.target=null;u.job=null;u.work=0;}
const COST={house:{wood:30,stone:10},farm:{wood:25,gold:20},barracks:{wood:60,stone:40},tower:{wood:40,stone:60},quarry:{wood:30,gold:40},lumber:{gold:30,stone:5}}; const initialBuildings=()=>[{x:16,y:16,type:'hall'},{x:18,y:16,type:'house'}]; S.buildings=S.buildings||initialBuildings();let placing=null; const afford=t=>Object.entries(COST[t]).every(([k,v])=>S.res[k]>=v); function buildAt(p){let x=Math.round(p.x),y=Math.round(p.y);if(x<1||y<1||x>N-2||y>N-2||S.buildings.some(b=>dist(b,{x,y})<1.8)||S.nodes.some(n=>n.left>0&&dist(n,{x,y})<1.2)||S.units.some(u=>dist(u,{x,y})<1)){say('Choose a clear plot');return;}if(!S.units.some(u=>u.type==='villager')){say('Train a villager first');return;}if(!afford(placing)){say('Not enough resources');return;}for(const [k,v] of Object.entries(COST[placing]))S.res[k]-=v;S.buildings.push({x,y,type:placing,left:8});say('Building placed: '+placing);placing=null;save();ui();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function say(t){notice=t;noticeUntil=performance.now()+3500;}
function resize(){let r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(cv);resize();
function project(x,y){return{x:W/2+(x-y-camera.x+camera.y)*32*zoom,y:H/2+(x+y-camera.x-camera.y)*16*zoom}}
function unproject(x,y){let a=(x-W/2)/(32*zoom),b=(y-H/2)/(16*zoom);return{x:camera.x+(a+b)/2,y:camera.y+(b-a)/2}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function img(name,p,h){let i=sprites[name];if(i&&i.complete&&i.naturalWidth){let w=h*i.naturalWidth/i.naturalHeight;ctx.drawImage(i,p.x-w/2,p.y-h,w,h);return true}return false}
function drawNode(n,p){let z=zoom;ellipse(p.x,p.y,13*z,5*z,'#0003');if(n.type==='wood'){ctx.fillStyle='#755038';ctx.fillRect(p.x-3*z,p.y-25*z,6*z,25*z);for(let i=0;i<3;i++){let y=p.y-(i*10+10)*z;poly([{x:p.x-16*z+i*3*z,y},{x:p.x,y:y-29*z},{x:p.x+16*z-i*3*z,y}],['#295e3c','#36794b','#4b9252'][i]);}}else if(n.type==='stone'||n.type==='gold'){poly([{x:p.x-15*z,y:p.y-3*z},{x:p.x-10*z,y:p.y-15*z},{x:p.x+3*z,y:p.y-21*z},{x:p.x+14*z,y:p.y-9*z},{x:p.x+10*z,y:p.y}], n.type==='gold'?'#e8ba58':'#a8b2ac','#596b62');}else{ellipse(p.x,p.y-6*z,13*z,9*z,'#3b7042');for(let i=0;i<5;i++)ellipse(p.x+(i-2)*4*z,p.y-(5+i%2*5)*z,2.5*z,2.5*z,'#ce7760')}}
function drawUnit(u,p){let z=zoom,enemy=u.enemy,kind=u.type==='villager'?(u.job?({wood:'lumberjack',stone:'miner',gold:'miner',food:'farmer'}[u.job.type]||'male'):(u.id%2?'male':'female')):u.type;let h=(['ember','frost','storm'].includes(kind)?100:58)*z;ellipse(p.x,p.y,13*z,6*z,'#0005',selected.has(u.id)?'#c8ff79':enemy?'#ef7666':null);let bob=u.target||u.job?Math.sin(performance.now()/100+u.id)*2*z:0;img(kind,{x:p.x,y:p.y+bob},h);if(enemy||selected.has(u.id)||u.hp<u.max){ctx.fillStyle='#211d19';ctx.fillRect(p.x-15*z,p.y-h-7*z,30*z,4*z);ctx.fillStyle=enemy?'#e66b56':'#92d875';ctx.fillRect(p.x-15*z,p.y-h-7*z,30*z*Math.max(0,u.hp/u.max),4*z)}if(u.flash>0){ctx.fillStyle='#ffe8a2';ctx.font=`bold ${13*z}px sans-serif`;ctx.textAlign='center';ctx.fillText('−'+u.damage,p.x,p.y-h-12*z)}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#263f2b';ctx.fillRect(0,0,W,H);for(let x=0;x<N;x++)for(let y=0;y<N;y++){let p=project(x,y);if(p.x< -70*zoom||p.x>W+70*zoom||p.y< -35*zoom||p.y>H+35*zoom)continue;let r=rand(x,y),g=99+Math.floor(r*22);poly([project(x-.5,y-.5),project(x+.5,y-.5),project(x+.5,y+.5),project(x-.5,y+.5)],`rgb(${g-25},${g+25},${g-43})`,'#365e3610');if(r>.65){ctx.fillStyle='#d6db8b33';ctx.fillRect(p.x,p.y,2*zoom,2*zoom)}}let all=[...S.buildings.map(o=>({...o,kind:'building'})),...S.nodes.filter(n=>n.left>0).map(o=>({...o,kind:'node'})),...S.units.concat(S.enemies).map(o=>({...o,kind:'unit'}))];all.sort((a,b)=>a.x+a.y-b.x-b.y);for(let o of all){let p=project(o.x,o.y);if(o.kind==='node')drawNode(o,p);else if(o.kind==='building'){ellipse(p.x,p.y,34*zoom,12*zoom,'#0004');img(o.type,p,(o.type==='hall'?145:82)*zoom);if(o.left>0){ctx.fillStyle='#ebc46b';ctx.fillRect(p.x-18*zoom,p.y+4*zoom,36*zoom*(1-o.left/8),4*zoom)}}else drawUnit(o,p)}if(box){ctx.strokeStyle='#e6fca1';ctx.fillStyle='#d5ff7720';ctx.fillRect(box.x,box.y,box.w,box.h);ctx.strokeRect(box.x,box.y,box.w,box.h)}mc.fillStyle='#45673c';mc.fillRect(0,0,140,84);for(const n of S.nodes)if(n.left>0){mc.fillStyle=n.type==='wood'?'#234b30':'#c1b589';mc.fillRect(n.x/N*140,n.y/N*84,2,2)}for(const u of S.units){mc.fillStyle=selected.has(u.id)?'#fff5a2':'#f4c367';mc.fillRect(u.x/N*140,u.y/N*84,3,3)}mc.strokeStyle='#f5df9b';mc.strokeRect(camera.x/N*140-10,camera.y/N*84-7,20,14)}
function ui(){ $('status').textContent=S.lost?'Kingdom fallen · New realm to retry':`Wave ${S.wave} · ${S.enemies.length?S.enemies.length+' enemies':Math.ceil(S.raid)+'s to raid'} · Population ${S.units.length}/${capacity()} · Wins ${S.wins}`; $('resources').innerHTML=['gold','wood','stone','food'].map(k=>`<span>${k.toUpperCase()} <b>${Math.floor(S.res[k])}</b></span>`).join('');let us=S.units.filter(u=>selected.has(u.id));$('selection').textContent=us.length?`${us.length} selected · ${us.filter(u=>u.type==='villager').length} villagers`:'No unit selected';$('detail').textContent=us.length?'Click ground to move, resource to gather, or enemy to attack.':'Select a unit, or drag a box around several units.';$('hint').textContent=performance.now()<noticeUntil?notice:'Click unit → click destination · drag empty ground to select · right-drag to pan';$('train').disabled=S.res.food<30||S.units.length>=capacity(); $('build').textContent=placing?'Cancel '+placing:'Build'; $('buildType').disabled=!!placing;}
function choose(ids,add=false){if(!add)selected.clear();ids.forEach(id=>selected.add(id));ui()}
function order(p,node){let us=S.units.filter(u=>selected.has(u.id));us.forEach((u,i)=>{u.job=node&&u.type==='villager'?{x:node.x,y:node.y,type:node.type}:null;u.attack=null;u.work=0;let offset=us.length>1?(i-(us.length-1)/2)*.55:0;u.target={x:clamp(p.x+offset,1,N-2),y:clamp(p.y+(node ? .7 : 0),1,N-2)}});say(node?'Gather command issued to villagers':'Move command issued');}
function click(x,y,shift){let p=unproject(x,y);if(placing){buildAt(p);return}let enemy=S.enemies.find(u=>{let a=project(u.x,u.y);return Math.abs(a.x-x)<23*zoom&&y>a.y-65*zoom&&y<a.y+8*zoom});if(enemy&&selected.size){for(let u of S.units.filter(u=>selected.has(u.id))){u.attack=enemy.id;u.job=null;u.target=null}return}let u=S.units.find(u=>{let a=project(u.x,u.y);return Math.abs(a.x-x)<20*zoom&&y>a.y-64*zoom&&y<a.y+8*zoom});if(u){if(shift&&selected.has(u.id))selected.delete(u.id);else choose([u.id],shift);return}if(selected.size){let n=S.nodes.find(n=>n.left>0&&dist(n,p)<.9)||S.nodes.find(n=>{let a=project(n.x,n.y);return n.left>0&&Math.abs(a.x-x)<13*zoom&&y>a.y-30*zoom&&y<a.y+5*zoom});order(n||p,n)}else choose([])}
cv.oncontextmenu=e=>e.preventDefault();cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,button:e.button,cx:camera.x,cy:camera.y,shift:e.shiftKey};};cv.onpointermove=e=>{if(!drag)return;let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(drag.button===2||drag.button===1){camera.x=clamp(drag.cx-(dx/(32*zoom)+dy/(16*zoom))/2,0,N);camera.y=clamp(drag.cy-(-dx/(32*zoom)+dy/(16*zoom))/2,0,N)}else if(Math.hypot(dx,dy)>7)box={x:drag.x,y:drag.y,w:dx,h:dy};};cv.onpointerup=e=>{if(!drag)return;if(box){let x1=Math.min(box.x,box.x+box.w),x2=Math.max(box.x,box.x+box.w),y1=Math.min(box.y,box.y+box.h),y2=Math.max(box.y,box.y+box.h);choose(S.units.filter(u=>{let p=project(u.x,u.y);return p.x>=x1&&p.x<=x2&&p.y>=y1&&p.y<=y2}).map(u=>u.id),drag.shift)}else if(drag.button===0)click(e.offsetX,e.offsetY,e.shiftKey);drag=null;box=null};cv.onpointercancel=()=>{drag=null;box=null};cv.onwheel=e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.12:.89),.55,2.1) };$('plus').onclick=()=>zoom=clamp(zoom+.2,.55,2.1);$('minus').onclick=()=>zoom=clamp(zoom-.2,.55,2.1);$('home').onclick=()=>{camera={x:16,y:16};zoom=1.15};mini.onclick=e=>{let r=mini.getBoundingClientRect();camera={x:clamp((e.clientX-r.left)/r.width*N,0,N),y:clamp((e.clientY-r.top)/r.height*N,0,N)}};$('workers').onclick=()=>choose(S.units.filter(u=>u.type==='villager').map(u=>u.id));$('army').onclick=()=>choose(S.units.filter(u=>u.type!=='villager').map(u=>u.id));$('stop').onclick=()=>S.units.filter(u=>selected.has(u.id)).forEach(u=>{u.target=null;u.job=null;u.attack=null;u.work=0});$('train').onclick=()=>{if(S.res.food>=30&&S.units.length<capacity()){S.res.food-=30;S.units.push({id:S.next++,type:'villager',x:17+Math.random(),y:17+Math.random()});ui()}};$('save').onclick=()=>say(save()?'Realm saved':'Save failed');$('reset').onclick=()=>{if(confirm('Reset RTS prototype progress? Classic game is unaffected.')){S=fresh();S.buildings=initialBuildings();init();placing=null;selected.clear();save();ui()}};
$('build').onclick=()=>{if(placing){placing=null;say('Construction cancelled')}else{placing=$('buildType').value;say('Click clear ground to place '+placing)}ui()}; let last=performance.now(),elapsed=0;function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;simulate(dt);for(const u of S.units){if(u.target){let d=dist(u,u.target),v=dt*(u.type==='villager'?2.2:2.8);if(d<=v){u.x=u.target.x;u.y=u.target.y;u.target=null}else{u.x+=(u.target.x-u.x)/d*v;u.y+=(u.target.y-u.y)/d*v}}else if(u.job){let n=S.nodes.find(n=>n.x===u.job.x&&n.y===u.job.y&&n.left>0);if(!n){u.job=null;u.work=0}else{u.work=(u.work||0)+dt;if(u.work>=1){u.work-=1;let amount=Math.min(3,n.left);n.left-=amount;S.res[n.type]+=amount}}}}draw();elapsed+=dt;if(elapsed>.25){elapsed=0;ui()}requestAnimationFrame(frame)}
const ST={villager:[55,5,1],sword:[110,18,1.2],spear:[100,22,1.5],archer:[75,15,4.3],knight:[180,30,1.3],wizard:[90,32,4.5],priest:[90,14,3],guard:[220,32,1.5],paladin:[260,42,1.4],king:[280,48,1.5],queen:[180,35,4],commander:[230,40,1.5],ember:[380,60,3.2],frost:[420,56,4],storm:[350,70,4],goblin:[55,9,1.2],orc:[120,16,1.2],skeleton:[80,13,1.2],darkknight:[180,24,1.3],cultist:[95,20,3.5]};
const prices={sword:[25,30],spear:[30,40],archer:[35,45],knight:[60,100],wizard:[50,120],priest:[40,85],guard:[80,150],paladin:[100,200],king:[120,280],queen:[100,260],commander:[90,180],ember:[150,350],frost:[180,420],storm:[200,500]};
function capacity(){return 10+S.buildings.filter(b=>b.type==='house'&&!b.left).length*6}
function stats(u){let a=ST[u.type]||ST.villager;u.max=a[0];if(!Number.isFinite(u.hp))u.hp=u.max;u.cd=u.cd||0;return a}
function init(){S.enemies=S.enemies||[];S.wave=S.wave||0;S.wins=S.wins||0;S.raid=S.raid??180;S.lost=!!S.lost;for(const u of S.units.concat(S.enemies))stats(u)}
function walk(u,p,dt){let d=dist(u,p),v=dt*(u.enemy?1.35:2.6);if(d>0){u.x=clamp(u.x+(p.x-u.x)/d*Math.min(v,d),1,N-2);u.y=clamp(u.y+(p.y-u.y)/d*Math.min(v,d),1,N-2)}}
function hit(u,v,amount){v.hp-=amount;v.flash=.6;v.damage=amount}
function spawn(){S.wave++;let types=['goblin','orc','skeleton','darkknight','cultist'];for(let i=0;i<Math.min(12,2+S.wave);i++){let u={id:S.next++,type:types[Math.min(4,Math.floor((S.wave+i-1)/3))],x:3+i*.65,y:4,enemy:true};stats(u);S.enemies.push(u)}say('Raid wave '+S.wave+' approaching!')}
function simulate(dt){if(S.lost)return;for(let b of S.buildings){if(b.left>0)b.left=Math.max(0,b.left-dt);else if(b.type==='farm')S.res.food+=dt*.55;else if(b.type==='quarry')S.res.stone+=dt*.4;else if(b.type==='lumber')S.res.wood+=dt*.5;else if(b.type==='hall')S.res.gold+=dt*.35;if(b.type==='tower'&&!b.left){b.cd=(b.cd||0)-dt;let e=S.enemies.find(e=>dist(b,e)<4);if(e&&b.cd<=0){hit(b,e,24);b.cd=1}}}if(!S.enemies.length){S.raid-=dt;if(S.raid<=0)spawn()}let had=S.enemies.length;for(let u of S.units.concat(S.enemies)){let a=stats(u);u.cd-=dt;u.flash=Math.max(0,(u.flash||0)-dt);if(u.hp<=0)continue;let targets=(u.enemy?S.units:S.enemies).filter(v=>v.hp>0);let target=targets.find(v=>v.id===u.attack);if(!target&&(u.enemy||(!u.target&&!u.job&&u.type!=='villager')))target=targets.sort((v,w)=>dist(u,v)-dist(u,w))[0];if(target&&(u.enemy||u.attack||dist(u,target)<5)){u.target=null;if(dist(u,target)>a[2])walk(u,target,dt);else if(u.cd<=0){hit(u,target,a[1]);u.cd=.85}}else if(u.enemy){let hall=S.buildings.find(b=>b.type==='hall');if(hall&&dist(u,hall)>1.2)walk(u,hall,dt);else if(hall&&u.cd<=0){hall.hp=(hall.hp??600)-a[1];u.cd=1;if(hall.hp<=0){S.lost=true;say('Kingdom fallen')}}}else if(u.attack)u.attack=null}S.units=S.units.filter(u=>u.hp>0);S.enemies=S.enemies.filter(u=>u.hp>0);if(had&&!S.enemies.length){S.wins++;S.raid=90;S.res.gold+=100+S.wave*30;S.res.food+=50;say('Victory! Raid defeated. Gold and food awarded.')}}
init();$('recruit').onclick=()=>{let t=$('unitType').value,c=prices[t];if(!c)return;if(!S.buildings.some(b=>b.type==='barracks'&&!b.left)){say('Build a Barracks first');return}if(S.res.food<c[0]||S.res.gold<c[1]||S.units.length>=capacity()){say('Not enough resources or population');return}S.res.food-=c[0];S.res.gold-=c[1];let b=S.buildings.find(b=>b.type==='barracks'&&!b.left),u={id:S.next++,type:t,x:b.x+1,y:b.y+1};stats(u);S.units.push(u);say('Recruited '+t);ui()};$('unitType').innerHTML=Object.entries(prices).map(([k,c])=>`<option value="${k}">${k.toUpperCase()} · ${c[0]}F ${c[1]}G</option>`).join('');$('raidNow').onclick=()=>{if(!S.enemies.length&&!S.lost){S.raid=0;say('Raid called')}};
ui();requestAnimationFrame(frame);setInterval(save,5000);
</script></body></html>
